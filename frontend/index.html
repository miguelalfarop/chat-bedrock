<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat IA en AWS</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7385;
      --user: #2f5bd3; --user-text: #fff; --bot: #eef0f4; --border: #dde1e8; --error: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14161b; --panel: #1c1f26; --text: #e6e8ee; --muted: #9aa2b2;
              --user: #4b74e6; --bot: #262a33; --border: #2e333d; --error: #f97066; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
             display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 17px; margin: 0; }
    header button { background: none; border: 1px solid var(--border); color: var(--muted);
                    border-radius: 8px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 14px; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
            max-width: 820px; width: 100%; margin: 0 auto; }
    .msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .error { align-self: center; color: var(--error); font-size: 14px; }
    .typing { color: var(--muted); font-style: italic; }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border);
           background: var(--panel); max-width: 820px; width: 100%; margin: 0 auto; }
    textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px;
               border: 1px solid var(--border); background: var(--bg); color: var(--text); max-height: 160px; }
    textarea:focus { outline: 2px solid var(--user); outline-offset: -1px; }
    #send { background: var(--user); color: #fff; border: 0; border-radius: 10px; padding: 0 18px;
            font: inherit; font-weight: 600; cursor: pointer; }
    #send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Chat IA · Amazon Bedrock</h1>
    <button id="reset" type="button">Nueva conversación</button>
  </header>
  <main id="chat" aria-live="polite">
    <p class="empty">Escribe un mensaje para empezar.</p>
  </main>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Escribe tu mensaje… (Enter para enviar, Shift+Enter para salto de línea)" maxlength="4000" required></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>

  <script src="config.js"></script>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let history = [];

    function addBubble(cls, text) {
      chat.querySelector(".empty")?.remove();
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage(text) {
      history.push({ role: "user", content: text });
      addBubble("user", text);
      const typing = addBubble("assistant typing", "Pensando…");
      send.disabled = true;

      try {
        if (!window.CHAT_API_URL || window.CHAT_API_URL.startsWith("PEGA_AQUI")) {
          throw new Error("Falta configurar CHAT_API_URL en config.js");
        }
        const res = await fetch(window.CHAT_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || `Error HTTP ${res.status}`);
        typing.remove();
        history.push({ role: "assistant", content: data.reply });
        addBubble("assistant", data.reply);
      } catch (err) {
        typing.remove();
        history.pop(); // el mensaje fallido no queda en el historial
        addBubble("error", "⚠ " + err.message);
        input.value = text;
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = "";
      input.style.height = "auto";
      sendMessage(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    document.getElementById("reset").addEventListener("click", () => {
      history = [];
      chat.innerHTML = '<p class="empty">Escribe un mensaje para empezar.</p>';
      input.focus();
    });
  </script>
</body>
</html>
