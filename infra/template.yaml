AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Chat web con IA - frontend estatico en S3, API Gateway (HTTP API) + Lambda (Python)
  que llama a Claude en Amazon Bedrock.

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket S3 donde subiste lambda.zip (debe estar en la misma region que el stack).
  CodeKey:
    Type: String
    Default: lambda.zip
    Description: Nombre del archivo zip de la Lambda dentro del bucket.
  ModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: ID del modelo de Claude en Bedrock.
  Effort:
    Type: String
    Default: low
    AllowedValues: [low, medium, high]
    Description: Nivel de esfuerzo del modelo (mas alto = respuestas mas elaboradas y mas tokens).
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Origen permitido por CORS. Cambialo por la URL del sitio cuando la conozcas.

Resources:
  # ---------- Backend ----------
  ChatFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeBedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock-mantle:*
                Resource: "*"

  ChatFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Chat con Claude en Amazon Bedrock
      Runtime: python3.13
      Architectures: [x86_64]
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ChatFunctionRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          EFFORT: !Ref Effort

  ChatFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatFunction}
      RetentionInDays: 7

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 3600

  ChatIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ChatFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  ChatRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /chat
      Target: !Sub integrations/${ChatIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      # Limita el trafico para que nadie dispare el gasto en Bedrock.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ChatFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/chat

  # ---------- Frontend ----------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicRead
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*

Outputs:
  ApiUrl:
    Description: URL del endpoint del chat (pegala en frontend/config.js)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/chat
  WebsiteBucketName:
    Description: Bucket donde subir index.html y config.js
    Value: !Ref WebsiteBucket
  WebsiteUrl:
    Description: URL publica de la aplicacion web
    Value: !GetAtt WebsiteBucket.WebsiteURL
